# Stack local das pipelines: Dagster (webserver + daemon), Postgres e Selenium.
#   cp .env.example .env   # preencher SUPABASE_DB_URL e GROQ_API_KEY_*
#   docker compose up -d --build
#   UI: http://localhost:3001
x-dagster: &dagster
  build: .
  image: industry-dagster
  env_file: .env
  environment:
    POSTGRES_USER: industry
    POSTGRES_PASSWORD: industry
    # notícias no Postgres local (volume de texto); licitações seguem o .env
    # (LICITACOES_PG_URL ou, se vazio, SUPABASE_DB_URL)
    NOTICIAS_PG_URL: postgresql://industry:industry@postgres:5432/industry
    SELENIUM_URL: http://selenium:4444
    INDUSTRY_DATA_DIR: /opt/codigos/industry/.data
    EMPLOYMENT_DIR: /opt/codigos/employment
    RF_EXPORTS_DIR: /opt/codigos/scripts/receita_federal/dados/exports
  volumes:
    - .:/opt/codigos/industry
    - ../employment:/opt/codigos/employment
    - ../scripts:/opt/codigos/scripts
    - hf_cache:/opt/hf_cache
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: industry
      POSTGRES_PASSWORD: industry
      POSTGRES_DB: industry
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-dagster.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U industry"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  selenium:
    image: selenium/standalone-chrome:4.25.0
    shm_size: 2gb
    environment:
      SE_NODE_MAX_SESSIONS: 1
      SE_NODE_SESSION_TIMEOUT: 300
    ports:
      - "4444:4444"
    restart: unless-stopped

  dagster-webserver:
    <<: *dagster
    command: dagster-webserver -h 0.0.0.0 -p 3000 -w /opt/dagster/workspace.yaml
    ports:
      - "3001:3000"

  dagster-daemon:
    <<: *dagster
    command: dagster-daemon run -w /opt/dagster/workspace.yaml

volumes:
  pg_data:
  hf_cache:
